version: 2
updates:
  # Action versions drift silently and only announce themselves when a
  # deprecated runner image stops working mid-release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci:"
    labels: [dependencies]

  # Sparkle is the only entry here, and it's the one dependency that can
  # replace the app on a user's machine — worth knowing when it moves.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps:"
    labels: [dependencies]
