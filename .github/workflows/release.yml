name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    env:
      # Presence checks for optional secrets. Secrets can't be used directly in
      # an `if:`, so they're reduced to booleans here.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"

          # A workflow_dispatch run has no tag; a tag push must agree with VERSION
          # so the bundle, the release, and the cask can never disagree.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "$TAG" = "v$version" ] \
              || { echo "Tag $TAG does not match VERSION $version"; exit 1; }
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=PomodoroCount-$version.zip" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Run tests before releasing
        run: swift test

      - name: Import the signing certificate
        id: signing
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          # The import now sits ahead of a full build-app.sh run rather than
          # seconds before its one codesign call, so the timeout has to
          # outlive the build, not just the import: 6 hours, not 15 minutes.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Must also fire on the failure path: a wrong P12_PASSWORD aborts
          # set -e inside `security import` and would otherwise leave the
          # decoded private key on disk for the rest of the job.
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null

          # Read the identity out of the keychain rather than carrying it as a
          # secret. A stored string can disagree with the certificate, and what
          # that produces is "no identity found" at codesign time. Asserting the
          # prefix catches the certificate that is easy to export by mistake: an
          # "Apple Development" cert signs fine and notarizes never.
          found="$(security find-identity -v -p codesigning "$keychain" |
                   sed -n 's/.*"\(.*\)".*/\1/p')"
          identity="$(printf '%s\n' "$found" |
                      grep '^Developer ID Application: ' | head -1 || true)"
          if [ -z "$identity" ]; then
            echo "The imported .p12 holds no 'Developer ID Application' certificate."
            echo "It holds: ${found:-<nothing>}"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Signing as $identity"

      # SPARKLE_PUBLIC_KEY comes from a repository variable (it isn't secret).
      # Without it the app builds with its updater disabled rather than shipping
      # one that can't verify anything.
      #
      # CODESIGN_IDENTITY is empty when signing is off, and build-app.sh reads
      # that as ad-hoc — the same bundle every CI push already produces.
      - name: Build the .app
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./build-app.sh

      # Runs before notarization, not after, so a missing Team ID fails in
      # seconds instead of after a notarytool round trip: this is the check
      # that would have caught the -maxdepth walk which skipped Sparkle's XPC
      # services — they stayed ad-hoc, with no team at all, and notarization
      # failed without naming them.
      - name: Verify every nested binary carries the app's team
        if: env.HAS_SIGNING == 'true'
        env:
          APP: build/Pomodoro Count.app
        run: |
          set -euo pipefail
          team="$(codesign -dvv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [ -n "$team" ] || { echo "the app has no TeamIdentifier"; exit 1; }
          fw="$APP/Contents/Frameworks/Sparkle.framework"
          ver="$(readlink "$fw/Versions/Current")"
          for nested in XPCServices/Downloader.xpc XPCServices/Installer.xpc \
                        Updater.app Autoupdate; do
            got="$(codesign -dvv "$fw/Versions/$ver/$nested" 2>&1 |
                   sed -n 's/^TeamIdentifier=//p')"
            [ "$got" = "$team" ] \
              || { echo "$nested has TeamIdentifier '${got:-not set}', want '$team'"; exit 1; }
          done
          echo "Every nested binary carries team $team"

      # Inert until a Developer ID exists. Add these repository secrets to turn
      # it on, with no other change needed — see packaging/signing/README.md:
      #   DEVELOPER_ID_P12          base64 of the exported .p12
      #   DEVELOPER_ID_P12_PASSWORD
      #   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8
      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APP: build/Pomodoro Count.app
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          chmod 600 "$keyfile"

          # An App Store Connect API key, not an Apple ID and app-specific
          # password: the password is revoked whenever that account's password
          # changes, which breaks releases months later for an unrelated reason.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$keyfile" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          # Staples the ticket into the bundle so first launch needs no network.
          xcrun stapler staple "$APP"

      - name: Verify Gatekeeper accepts it
        if: env.HAS_SIGNING == 'true'
        env:
          APP: build/Pomodoro Count.app
        run: |
          set -euo pipefail
          codesign --verify --strict --deep --verbose=2 "$APP"
          xcrun stapler validate "$APP"

          # The question a release actually has to answer: what does Gatekeeper
          # do with this on a machine that has never seen it. spctl exits zero
          # for other accept sources too — "the user already trusts it" — so the
          # source is asserted, not just the exit code. This runs after stapling,
          # so it resolves from the embedded ticket rather than the network.
          #
          # spctl exits 3 when it rejects the app, and under `set -euo
          # pipefail` that would kill the step right at the assignment —
          # before the case below ever runs, so the maintainer would see only
          # "exit code 3" and never spctl's own reason. The `|| true` lets the
          # diagnostic outlive a rejection so the case statement is what
          # decides, and can say why.
          assessment="$(spctl --assess --type execute --verbose=4 "$APP" 2>&1 || true)"
          echo "$assessment"
          case "$assessment" in
            *"source=Notarized Developer ID"*) ;;
            *) echo "Gatekeeper did not accept this as notarized"; exit 1 ;;
          esac
          echo "Signed, notarized, and stapled"

      - name: Package
        id: package
        env:
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          # ditto, not zip: it preserves the bundle's symlinks and metadata.
          ditto -c -k --keepParent "build/Pomodoro Count.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Sparkle verifies every update against the public key baked into the app,
      # so an unsigned appcast means clients correctly refuse to install. Skipped
      # when the key isn't configured — see packaging/sparkle/README.md.
      - name: Build the Sparkle appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          chmod 600 "$keyfile"

          sign_update="$(find .build/artifacts -name sign_update -type f | head -1)"
          # Prints: sparkle:edSignature="…" length="…"
          attrs="$("$sign_update" "$ZIP" --ed-key-file "$keyfile")"

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$ZIP"
          pubdate="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"

          # Only the newest item is needed; Sparkle picks the highest version it
          # finds, and older builds are still downloadable from their releases.
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Pomodoro Count</title>'
            echo "    <item>"
            echo "      <title>Version $VERSION</title>"
            echo "      <pubDate>$pubdate</pubDate>"
            echo "      <sparkle:version>$VERSION</sparkle:version>"
            echo "      <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>"
            echo "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
            echo "      <sparkle:releaseNotesLink>https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION</sparkle:releaseNotesLink>"
            echo "      <enclosure url=\"$url\" type=\"application/octet-stream\" $attrs />"
            echo "    </item>"
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml

          xmllint --noout appcast.xml
          echo "appcast.xml built for $VERSION"

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The section for this version, without its own heading. Stops at the
          # next version heading, or at the link-reference block that follows the
          # oldest section — otherwise the very first release would trail the
          # "[1.0.0]: https://..." definitions into its notes.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab && /^\[[^]]+\]: / { exit }
            grab                   { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $VERSION"; exit 1
          fi

          cat >> notes.md <<'FOOTER'

          ---

          ### Installing

          ```
          brew install --cask markgustetic/tap/pomodoro-count
          ```

          Or download the zip below and drag **Pomodoro Count.app** to
          `/Applications`. This build is **unsigned**, so the first launch needs a
          one-time confirmation: right-click the app, choose **Open**, then
          **Open** again. Verify the download with the `.sha256` file attached.
          FOOTER

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          tag="$TAG"
          [ "$GITHUB_REF_TYPE" = "tag" ] || tag="v$VERSION"
          assets=("$ZIP" "$ZIP.sha256")
          # The app's feed URL is releases/latest/download/appcast.xml, so this
          # asset must ride along with every release or updates stop resolving.
          [ -f appcast.xml ] && assets+=(appcast.xml)

          gh release create "$tag" \
            --title "Pomodoro Count $VERSION" \
            --notes-file notes.md \
            "${assets[@]}"

      # Needs a HOMEBREW_TAP_TOKEN secret (a PAT with contents:write on the tap
      # repo) — GITHUB_TOKEN can't push to a different repository.
      - name: Update the Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:$GH_TOKEN@github.com/markgustetic/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA256__/$SHA256/g" \
            packaging/homebrew/pomodoro-count.rb.template > tap/Casks/pomodoro-count.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pomodoro-count.rb
          git diff --staged --quiet && { echo "Cask already current"; exit 0; }
          git commit -m "pomodoro-count $VERSION"
          git push
