name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A few details make this much faster to fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
      placeholder: I clicked Log completed pomodoro and the count went down.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu bar panel
        2. Click …
        3. See …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the panel, next to Quit.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Homebrew cask
        - Release zip
        - Built from source
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Screenshots help a lot for visual problems. If it involves losing counts,
        the contents of ~/Library/Application Support/PomodoroCount/data.json are
        useful — it's plain JSON, so check it for anything you'd rather not share.
